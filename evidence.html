<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload Evidence</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<div class="logo">
🛡 SafeSpeak
</div>

<nav>

<a href="index.html">Home</a>

<a href="report.html">Report</a>

<a href="track.html">Track</a>

<a href="dashboard.html">Dashboard</a>

</nav>

<button class="exit-btn" onclick="quickExit()">
Quick Exit
</button>

</header>

<section class="report-page">

<h1>Upload Evidence (Optional)</h1>

<p>
Upload screenshots, images or documents related to your report.
This step is optional.
</p>

<input type="file" id="evidenceFile" accept="image/*,.pdf">

<br><br>

<img id="preview" style="max-width:300px; display:none; border-radius:10px;">

<br><br>

<a href="complaint.html">
    <button type="button" class="btn">
        Continue to Complaint
    </button>
</a>

</section>

<script>

document.getElementById("evidenceFile").addEventListener("change", function(){

const file = this.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(e){

document.getElementById("preview").src = e.target.result;

document.getElementById("preview").style.display = "block";

};

reader.readAsDataURL(file);

}

});

</script>

<script src="script.js"></script>

</body>
</html>
